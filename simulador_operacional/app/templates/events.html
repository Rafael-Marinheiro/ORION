{% extends 'base.html' %}
{% block content %}
<h2>Eventos Ocorridos</h2>
<table>
  <tr>
    <th>Rodada</th>
    <th>Evento</th>
    <th>Impacto</th>
    <th>Data</th>
  </tr>
  {% for ev in eventos %}
  <tr>
    <td>{{ ev.rodada }}</td>
    <td>{{ ev.evento.descricao }}</td>
    <td>{{ ev.evento.impacto }}</td>
    <td>{{ ev.data_ocorrencia|date:'d/m/Y H:i' }}</td>
  </tr>
  {% empty %}
  <tr><td colspan="4">Nenhum evento registrado.</td></tr>
  {% endfor %}
</table>
{% endblock %}
