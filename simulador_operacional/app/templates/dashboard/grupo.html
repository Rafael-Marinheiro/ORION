{% extends 'base.html' %}

{% block content %}
<h2>Dashboard do Grupo</h2>
<table class="table">
    <thead>
        <tr>
            <th>Rodada</th>
            <th>Receita</th>
            <th>Lucro</th>
        </tr>
    </thead>
    <tbody>
        {% for r in resultados %}
        <tr>
            <td>{{ r.rodada }}</td>
            <td>{{ r.receita }}</td>
            <td>{{ r.lucro }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Sem resultados disponíveis.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
