{% extends 'base.html' %}

{% block title %}Definir nova senha — ORION{% endblock %}

{% block content %}
<div class="o-auth">
    <h1>Definir nova senha</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="o-btn o-btn--primary o-btn--block">Salvar senha</button>
    </form>
</div>
{% endblock %}
