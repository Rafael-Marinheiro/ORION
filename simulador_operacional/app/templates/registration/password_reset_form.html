{% extends 'base.html' %}

{% block title %}Recuperar senha — ORION{% endblock %}

{% block content %}
<div class="o-auth">
    <h1>Recuperar senha</h1>
    <p class="o-muted">Informe o e-mail cadastrado. Enviamos um link para você definir uma senha nova.</p>
    <form method="post">
        {% csrf_token %}
        <p>
            {{ form.email.label_tag }}
            {{ form.email }}
        </p>
        <button type="submit" class="o-btn o-btn--primary o-btn--block">Enviar link</button>
    </form>
    <p class="o-auth__foot"><a href="{% url 'login' %}">Voltar para o login</a></p>
</div>
{% endblock %}
