{% extends 'base.html' %}

{% block content %}
<div class="login-form">
    <h2>Recuperar Senha</h2>
    <p>Informe seu email cadastrado para receber instruções de redefinição.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>
{% endblock %}
