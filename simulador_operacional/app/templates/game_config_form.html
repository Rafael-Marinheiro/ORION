{% extends 'base.html' %}

{% block content %}
<h2>Configuração do Jogo</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <p>
        {{ field.label_tag }}
        {{ field }}
        {% for error in field.errors %}
        <strong>{{ error }}</strong>
        {% endfor %}
    </p>
    {% endfor %}
    <button type="submit" class="btn">Salvar</button>
</form>
{% endblock %}
