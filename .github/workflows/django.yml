name: Quality Pipeline

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build validation
        run: |
          cd simulador_operacional
          python -m compileall app
      - name: Check for pending migrations (main track)
        run: |
          cd simulador_operacional
          python manage.py makemigrations --check --dry-run
      - name: Check for pending migrations (CI clean track)
        run: |
          cd simulador_operacional
          python manage.py makemigrations --check --dry-run --settings=simulador_operacional.settings_ci
      - name: Validate clean environment bootstrap
        run: |
          cd simulador_operacional
          python manage.py migrate --noinput --settings=simulador_operacional.settings_ci
          python manage.py seed_dados_base --settings=simulador_operacional.settings_ci
          python manage.py check --settings=simulador_operacional.settings_ci
      - name: Run critical tests with coverage gate
        run: |
          cd simulador_operacional
          coverage run --rcfile=../.coveragerc-critical manage.py test app --settings=simulador_operacional.settings_test
          coverage report --rcfile=../.coveragerc-critical --fail-under=85
          coverage xml --rcfile=../.coveragerc-critical -o ../coverage.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

