name: Django Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check for pending migrations
        run: |
          cd simulador_operacional
          python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: |
          cd simulador_operacional
          coverage run --rcfile=../.coveragerc manage.py test app --settings=simulador_operacional.settings_test
          coverage report --rcfile=../.coveragerc --fail-under=85
          coverage xml --rcfile=../.coveragerc -o ../coverage.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

